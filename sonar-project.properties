sonar.projectKey=EdwinUMG_NodeGoat
sonar.organization=edwinumg

# URL completa de SonarCloud con protocolo https://
sonar.host.url=https://sonarcloud.io

# Código fuente a analizar (Node.js)
sonar.sources=app

# Exclusiones de librerías estáticas y dependencias
sonar.exclusions=app/assets/vendor/**,node_modules/**,test/**
sonar.sourceEncoding=UTF-8

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=NodeGoat
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

