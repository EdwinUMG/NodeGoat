name: E2E Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: cypress/base:14
      options: --user root

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Start database seed and application
        run: |
          npm run db:seed || true
          nohup npm start &
          sleep 10
        env:
          MONGODB_URI: mongodb://mongodb:27017/nodegoat

      - name: Run Cypress tests
        run: npx cross-env NODE_ENV=test cypress run
